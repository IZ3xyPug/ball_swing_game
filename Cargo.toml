 [package]
name = "KnightsOfQuartz"
version = "0.1.0"
edition = "2021"
description = "nOrange"
license = "BSD-3-Clause"
repository = "https://github.com/CalebCouch/orangeme.git"
authors = ["Caleb Couch <caleb@orange.me>", "Ella Couch <ella@orange.me>"]

[dependencies]
image = "0.25.6"

ramp = { package = "ramp2", path = "../ramp" }

quartz = { path = "../quartz"}
rodio = "0.21.1"
rand = "0.9.2"
# So the headless harness can print the engine's tick profile, which is
# emitted through `log` and is otherwise a no-op with no logger installed.
env_logger = "0.11"
rgb = "0.8.52"
log = "0.4.27"


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.43.0", features = ["rt-multi-thread", "sync", "time", "net"] }

[lib]
name="main"
crate-type=["staticlib", "cdylib", "rlib"]

[[bin]]
name = "headless"
path = "src/bin/headless.rs"

[package.metadata.android]
package = "com.orange.pkg"
build_targets = [ "aarch64-linux-android", "armv7-linux-androideabi" ]

# The canvas is built with CanvasMode::Landscape, so the activity has to be
# landscape too. Set here rather than patched into the generated manifest by a
# build script: a text edit applied after cargo-apk has already packaged is a
# step that silently stops happening the moment anyone builds the normal way.
[package.metadata.android.application]
# Fullscreen: no title bar and no status bar.
#
# This is the part that can be done declaratively. Hiding the NAVIGATION bar as
# well needs `WindowInsetsController` at runtime, which is a JNI call this app
# has no Java side for — so the gesture pill or button row stays until that is
# wired up.
theme = "@android:style/Theme.NoTitleBar.Fullscreen"

[package.metadata.android.application.activity]
orientation = "landscape"

# `cargo apk build --release` needs a keystore or it ABORTS AFTER COMPILING —
# the .so and the manifest land in target/release/apk and no APK is ever
# produced. That failure is what build_android.sh was swallowing with `set +e`
# before hand-assembling an APK out of the intermediates.
#
# This is the standard Android debug keystore, which is not a secret: it exists
# on every machine with the SDK installed, its password is literally "android",
# and Google Play refuses anything signed with it. It is here so a test build
# completes, not to ship with.
[package.metadata.android.signing.release]
path = "debug.keystore"
keystore_password = "android"

[profile.dev.package."*"]
# Full optimization for deps (image, quartz, etc.) — fast rendering without changing tick rate.
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.sdk]
min_sdk_version = 33
target_sdk_version = 33
label = "Application Name"

[package.metadata.deb]
maintainer-scripts = "debian/"

[patch.crates-io]
prism2 = { path = "../prism" }

[dev-dependencies]
pollster = "0.4"
prism = { package = "prism2", path = "../prism" }
